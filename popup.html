<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 280px;
        padding: 14px;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #121212;
        color: #e0e0e0;
        margin: 0;
        box-sizing: border-box;
      }
      h3 {
        margin: 0 0 12px 0;
        font-size: 0.95rem;
        color: #3b82f6;
      }
      label {
        font-size: 0.75rem;
        color: #a0a0a0;
        display: block;
        margin: 8px 0 3px 0;
      }
      input,
      select {
        width: 100%;
        padding: 8px 10px;
        box-sizing: border-box;
        background: #1e1e1e;
        border: 1px solid #333;
        color: #fff;
        border-radius: 6px;
        font-size: 0.85rem;
      }
      input:focus,
      select:focus {
        outline: none;
        border-color: #3b82f6;
      }
      .hidden {
        display: none;
      }
      button {
        width: 100%;
        margin-top: 14px;
        padding: 9px;
        background: #3b82f6;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        font-size: 0.85rem;
      }
      button:hover {
        background: #2563eb;
      }
    </style>
  </head>
  <body>
    <h3>Save to Dashboard</h3>
    <label>Title</label>
    <input type="text" id="linkName" maxlength="25" />

    <label>URL</label>
    <input type="text" id="linkUrl" />

    <label>Folder</label>
    <select id="folderSelect">
      <option value="">Dashboard (Root)</option>
      <option value="__NEW__">+ Create New Folder</option>
    </select>

    <input
      type="text"
      id="newFolderName"
      class="hidden"
      placeholder="New folder name..."
      style="margin-top: 6px"
    />

    <button id="saveBtn">Save Link</button>
    <script src="js/popup.js"></script>
  </body>
</html>

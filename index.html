<!doctype html>
<html lang="en" prefix="og: http://ogp.me/ns#">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>0FluffStart — Minimalist New Tab & Start Page</title>
    <meta name="title" content="0FluffStart — Minimalist New Tab & Start Page" />
    <meta name="description" content="0FluffStart is a minimalist, high-performance local start page and new tab dashboard built for speed, clean organization, and seamless productivity." />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Open Graph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://0fluffstart.pages.dev/" />
    <meta property="og:site_name" content="0FluffStart" />
    <meta property="og:title" content="0FluffStart — Minimalist New Tab & Start Page" />
    <meta property="og:description" content="0FluffStart is a minimalist, high-performance local start page and new tab dashboard built for speed, clean organization, and seamless productivity." />
    <meta property="og:image" content="https://0fluffstart.pages.dev/og-banner-1200x630.png" />
    <meta property="og:image:secure_url" content="https://0fluffstart.pages.dev/og-banner-1200x630.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="0FluffStart Dashboard Preview" />

    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:domain" content="0Fluffstart.pages.dev" />
    <meta name="twitter:url" content="https://0fluffstart.pages.dev/" />
    <meta name="twitter:title" content="0FluffStart — Minimalist New Tab & Start Page" />
    <meta name="twitter:description" content="0FluffStart is a minimalist, high-performance local start page and new tab dashboard built for speed, clean organization, and seamless productivity." />
    <meta name="twitter:image" content="https://0fluffstart.pages.dev/og-banner-1200x630.png" />

    <!-- App Icons & Capabilities -->
    <link rel="icon" type="image/png" href="https://0fluffstart.pages.dev/icon.png" />
    <link rel="apple-touch-icon" href="https://0fluffstart.pages.dev/icon.png" />
    <link rel="manifest" href="https://0fluffstart.pages.dev/pwa-manifest.json" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <link rel="stylesheet" href="css/core.css" />
  </head>
  <body class="dark">
    <div class="search-backdrop"></div>
    <div id="bgOverlay" class="bg-overlay"></div>
    <div id="bgImage" class="bg-image hidden"></div>
    <video
      id="bgVideo"
      class="bg-video hidden"
      loop
      muted
      autoplay
      playsinline
    ></video>
    <div class="container">
      <header>
        <div id="clockDisplay" class="clock">00:00:00</div>
        <div id="greetingDisplay" class="greeting">Hello, User.</div>
      </header>

      <div class="search-bar">
        <div class="engine-switcher" id="engineSwitcher">
          <button class="engine-btn" id="engineDropdownBtn">
            <span id="currentEngineIcon">G</span>
            <span
              class="chevron icon-mask icon-chevron"
              style="width: 12px; height: 12px"
            ></span>
          </button>
          <button
            class="quick-suggest-btn"
            id="quickSuggestToggleBtn"
            title="Toggle Live Suggestions"
          >
            <span
              class="icon-mask icon-suggest"
              style="width: 19px; height: 19px"
            ></span>
          </button>
          <div id="engineDropdown" class="engine-dropdown hidden"></div>
        </div>

        <input
          type="text"
          id="searchInput"
          placeholder="Search or Type URL..."
        />

        <button class="search-icon" id="searchSubmitBtn">
          <span
            class="icon-mask icon-search"
            style="width: 24px; height: 24px"
          ></span>
        </button>

        <div
          id="suggestionsContainer"
          class="suggestions-container hidden"
        ></div>
      </div>

      <div id="linkGrid" class="link-grid"></div>
      <div id="navPillContainer" class="nav-pill-container hidden"></div>

    <div class="floating-settings">
      <a
        id="settingsToggleBtn"
        class="icon-btn floating-btn"
        href="settings.html"
        title="Settings"
        aria-label="Settings"
      >
        <span
          class="icon-mask icon-settings"
          style="width: 18px; height: 18px"
        ></span>
      </a>
    </div>

    </div>
    <div id="customCursorEngine" class="custom-cursor" aria-hidden="true">
      <span class="custom-cursor-icon icon-default-mouse-pointer"></span>
    </div>
    <script type="module" src="js/main.js"></script>

    <div class="mobile-dock" id="mobileDock">
      <button
        id="folderExitBtn"
        class="icon-btn floating-btn hidden"
        title="Back to Dashboard"
      >
        <span
          class="icon-mask icon-back"
          style="width: 20px; height: 20px"
        ></span>
      </button>

      <div class="mobile-search-pill" id="mobileSearchPill">
        <span
          class="icon-mask icon-search"
          style="width: 18px; height: 18px; opacity: 0.7"
        ></span>
        <span class="mobile-search-placeholder">Search or Type URL...</span>
      </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <div class="modal" id="customDialogModal">
      <div class="modal-content custom-dialog-content">
        <h3 id="customDialogTitle" class="custom-dialog-title">
          Are you sure?
        </h3>
        <p id="customDialogMessage" class="custom-dialog-message"></p>
        <div class="custom-dialog-actions">
          <button
            id="customDialogCancelBtn"
            class="secondary custom-dialog-btn-cancel"
          >
            Cancel
          </button>
          <button
            id="customDialogConfirmBtn"
            class="save-btn custom-dialog-btn-confirm"
          >
            Confirm
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
